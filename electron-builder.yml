appId: com.ribongrant.calendar
productName: Ribongrant Calendar
asar: true
asarUnpack:
  - "**/better-sqlite3/**/*.node"
files:
  - dist/**/*
  - server/**/*
  - electron/**/*
  - package.json
  - node_modules/**/*
  - "!node_modules/better-sqlite3/deps/**"
  - "!node_modules/better-sqlite3/src/**"
  - "!node_modules/better-sqlite3/prebuilds/darwin-*"
  - "!node_modules/better-sqlite3/prebuilds/linux-*"
  - "!node_modules/better-sqlite3/prebuilds/linuxmusl-*"
  - "!server/data.db*"
  - "!server/tmp_uploads/**"
win:
  signAndEditExecutable: false
  target:
    - target: portable
      arch:
        - x64
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
directories:
  buildResources: public
  output: dist_electron
npmRebuild: false
buildDependenciesFromSource: false
